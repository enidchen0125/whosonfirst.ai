<!-- @dsCard height=288 -->
<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Who’s on First</title>
{{FONTS}}
<style>
  html, body { margin: 0; height: 100%; }
  body { min-height: 0; display: block; background: var(--bg); color: var(--fg); font-family: var(--font-body); overflow: hidden; }
  .cover { position: relative; width: 960px; height: 288px; overflow: hidden; }
  /* the composition: a 480-wide box on the right half of the 960 layout, clear of the name */
  .art { position: absolute; top: 0; left: 480px; width: 480px; height: 288px; overflow: hidden; }
  .art svg { display: block; width: 480px; height: 288px; }
  .field { fill: var(--accent-soft); rx: var(--radius); }
  .base { rx: var(--radius); }
  .who { fill: var(--red); }
  .what { fill: var(--blue); }
  .idk { fill: var(--green); }
  .home { fill: var(--fg); }
  .dot { fill: var(--fg); }
  .words { position: absolute; left: 32px; bottom: 32px; max-width: 440px; }
  .name { margin: 0; font-family: var(--font-display); font-weight: var(--display-weight); font-style: normal;
    font-size: calc(92px * var(--display-scale)); line-height: 0.95; letter-spacing: var(--display-tracking-tight);
    text-transform: var(--display-transform); color: var(--fg); }
  .tag { margin: 16px 0 0 2px; font-size: 14px; line-height: 20px; color: var(--fg-muted); }
</style>
</head>
<body>
<div class="cover">
<div class="art" aria-hidden="true">
<svg viewBox="0 0 480 288" width="480" height="288">
<!--
  blocks      accent-soft 208×208 turned 45° (the infield, the tint) · red 64×64 at its right corner (Who, the principal) · blue 64×64 at the top, bled off the edge (What, the agent) · green 64×64 at the left (I Don’t Know, the resource) · fg 64×64 at the bottom, bled off the edge (home, the issuer) — about a quarter of 960×288
  arrangement a diamond: one large tint square with four identity squares on its corners, two of them cut by the top and bottom edges
  pattern     dots, from “a delegation chain is a line with stops”: fg dots at a gutter-min pitch along the three base paths a grant travels, home to first to second to third, and none on the way back home
  scales      infield side 13 × gutter-min, base side 4 × gutter-min, dot pitch gutter-min; corners the direction’s box radius
-->
<rect class="field" x="152" y="40" width="208" height="208" transform="rotate(45 256 144)"/>
<circle class="dot" cx="289.9" cy="257.1" r="2.5"/>
<circle class="dot" cx="301.3" cy="245.7" r="2.5"/>
<circle class="dot" cx="312.6" cy="234.4" r="2.5"/>
<circle class="dot" cx="323.9" cy="223.1" r="2.5"/>
<circle class="dot" cx="335.2" cy="211.8" r="2.5"/>
<circle class="dot" cx="346.5" cy="200.5" r="2.5"/>
<circle class="dot" cx="357.8" cy="189.2" r="2.5"/>
<circle class="dot" cx="369.1" cy="110.1" r="2.5"/>
<circle class="dot" cx="357.7" cy="98.7" r="2.5"/>
<circle class="dot" cx="346.4" cy="87.4" r="2.5"/>
<circle class="dot" cx="335.1" cy="76.1" r="2.5"/>
<circle class="dot" cx="323.8" cy="64.8" r="2.5"/>
<circle class="dot" cx="312.5" cy="53.5" r="2.5"/>
<circle class="dot" cx="301.2" cy="42.2" r="2.5"/>
<circle class="dot" cx="222.1" cy="30.9" r="2.5"/>
<circle class="dot" cx="210.7" cy="42.3" r="2.5"/>
<circle class="dot" cx="199.4" cy="53.6" r="2.5"/>
<circle class="dot" cx="188.1" cy="64.9" r="2.5"/>
<circle class="dot" cx="176.8" cy="76.2" r="2.5"/>
<circle class="dot" cx="165.5" cy="87.5" r="2.5"/>
<circle class="dot" cx="154.2" cy="98.8" r="2.5"/>
<rect class="base who" x="371" y="112" width="64" height="64" transform="rotate(45 403 144)"/>
<rect class="base what" x="224" y="-35" width="64" height="64" transform="rotate(45 256 -3)"/>
<rect class="base idk" x="77" y="112" width="64" height="64" transform="rotate(45 109 144)"/>
<rect class="base home" x="224" y="259" width="64" height="64" transform="rotate(45 256 291)"/>
</svg>
</div>
<div class="words">
<p class="name">Who’s on<br>First</p>
<p class="tag">Auth for AI agents: who is acting, for whom, and who said they could.</p>
</div>
</div>
</body>
</html>
