<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- A diamond with a base at each corner: three open, and first base filled
       in. The four bases are the same size, large enough that each still reads
       as a diamond at 16 pixels. The lines between them stop at the bases, so
       an open base is open on any background. Everything is drawn inside the
       box, with most of a unit to spare on every side. -->
  <style>
    .i { stroke: #15171a } .c { fill: #0b3fc4 }
    @media (prefers-color-scheme: dark) { .i { stroke: #e9e9e7 } .c { fill: #93b5ff } }
  </style>
  <path class="i" d="M17.9 8 24 14.1M24 17.9 17.9 24M14.1 24 8 17.9M8 14.1 14.1 8" fill="none" stroke-width="2"/>
  <rect class="i" x="13.3" y="3.4" width="5.4" height="5.4" transform="rotate(45 16 6.1)" fill="none" stroke-width="2"/>
  <rect class="i" x="3.4" y="13.3" width="5.4" height="5.4" transform="rotate(45 6.1 16)" fill="none" stroke-width="2"/>
  <rect class="i" x="13.3" y="23.2" width="5.4" height="5.4" transform="rotate(45 16 25.9)" fill="none" stroke-width="2"/>
  <rect class="c" x="22.2" y="12.3" width="7.4" height="7.4" transform="rotate(45 25.9 16)"/>
</svg>
