<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- A diamond with a base at each corner, and first base filled in. Everything
       is drawn inside the box, with half a unit to spare: first base is the
       largest, so the diamond sits a little left of center to make room. -->
  <style>
    .p { fill: #ffffff } .i { stroke: #15171a } .c { fill: #0b3fc4 }
    @media (prefers-color-scheme: dark) { .p { fill: #0e0f11 } .i { stroke: #e9e9e7 } .c { fill: #93b5ff } }
  </style>
  <path class="i" d="M15.4 5.2 26.2 16 15.4 26.8 4.6 16Z" fill="none" stroke-width="1.8" stroke-linejoin="round"/>
  <rect class="p i" x="13.2" y="3" width="4.4" height="4.4" transform="rotate(45 15.4 5.2)" stroke-width="1.4"/>
  <rect class="p i" x="2.4" y="13.8" width="4.4" height="4.4" transform="rotate(45 4.6 16)" stroke-width="1.4"/>
  <rect class="p i" x="13.2" y="24.6" width="4.4" height="4.4" transform="rotate(45 15.4 26.8)" stroke-width="1.4"/>
  <rect class="c" x="22.45" y="12.25" width="7.5" height="7.5" transform="rotate(45 26.2 16)"/>
</svg>
